<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TradeClaw — AI Meme Trading</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #888; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .boot { text-align: center; margin-top: 40vh; font-size: 14px; }
    .boot span { color: #00e676; font-weight: 700; }
  </style>
</head>
<body>
  <div class="boot">Loading <span>TradeClaw</span>…</div>
  <script>
    (function () {
      var COMMIT = '13c5b729030c7b93f124e13d1604ec45afb5ea2a';
      var url = 'https://cdn.jsdelivr.net/gh/Dennisbed1234/TradeClaw@' + COMMIT + '/index.html';
      fetch(url)
        .then(function (r) {
          if (!r.ok) throw new Error('Failed to load app shell');
          return r.text();
        })
        .then(function (html) {
          html = html.split('Meme Pump').join('TradeClaw');
          html = html.split('Meme Coins').join('Markets');
          // Keep local app.js (same origin) so /api/* still hits Vercel
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function (e) {
          document.body.innerHTML =
            '<div class="boot" style="color:#ff5252">Could not restore app.<br>' +
            (e.message || e) +
            '<br><br>On GitHub, restore index.html and app.js from commit 13c5b729.</div>';
        });
    })();
  </script>
</body>
</html>
