    function patchJs(js) {
      var robustResize =
        'function resize() {\n' +
        '  if (!canvas || !canvas.parentElement) return;\n' +
        '  var parent = canvas.parentElement;\n' +
        '  var rw = parent.getBoundingClientRect().width;\n' +
        '  var rh = parent.getBoundingClientRect().height;\n' +
        '  if (!(rw > 10)) rw = parent.clientWidth || parent.offsetWidth || 360;\n' +
        '  if (!(rh > 10)) rh = parent.clientHeight || parent.offsetHeight || 260;\n' +
        '  var dpr = devicePixelRatio || 1;\n' +
        '  canvas.width = rw * dpr; canvas.height = rh * dpr;\n' +
        '  canvas.style.width = rw + "px"; canvas.style.height = rh + "px";\n' +
        '  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); W = rw; H = rh;\n' +
        '}\n';
      js = js.replace(
        /function resize\(\) \{[\s\S]*?W = rect\.width; H = rect\.height;\n\}/,
        robustResize.trim()
      );
      js = js.replace(
        'resize();\nlet running',
        'resize();\n' +
        'setTimeout(function(){ try{ resize(); if(typeof drawChart==="function") drawChart(); }catch(e){} }, 0);\n' +
        'setTimeout(function(){ try{ resize(); if(typeof drawChart==="function") drawChart(); }catch(e){} }, 100);\n' +
        'setTimeout(function(){ try{ resize(); if(typeof drawChart==="function") drawChart(); }catch(e){} }, 400);\n' +
        'let running'
      );

      js = js.split('padR=88').join('padR=96');
      js = js.split(
        'const bubbleX=last.x+12; let bubbleY=last.y-bh/2;'
      ).join(
        'let bubbleX=last.x+8; if(bubbleX+bw>W-4) bubbleX=W-4-bw; let bubbleY=last.y-bh/2;'
      );

      js = js.split(
        "pnlEl.textContent = (pnl>=0?'+':'') + formatMoney(pnl) + ' · ' + (pnlPct>=0?'▲ ':'▼ ') + Math.abs(pnlPct).toFixed(2) + '%';"
      ).join(
        "pnlEl.innerHTML = (pnl>=0?'+':'') + formatMoney(pnl) + '<br>' + (pnlPct>=0?'▲ ':'▼ ') + Math.abs(pnlPct).toFixed(2) + '%';"
      );
      js = js.split(
        "pnlEl.textContent = '+$0.00 · 0.00%';"
      ).join(
        "pnlEl.innerHTML = '+$0.00<br>▲ 0.00%';"
      );

      return js;
    }

    function patchHtml(html) {
      // Country text input → dropdown (US default)
      html = html.replace(
        /<input type="text" id="authCountry"[^>]*>/,
        '<select id="authCountry" class="select-input" autocomplete="country-name">' +
          COUNTRY_OPTIONS +
        '</select>'
      );

      // US phone example instead of Nigeria
      html = html.replace(
        'placeholder="+234 801 234 5678"',
        'placeholder="+1 555 123 4567"'
      );

      // Remove Clear local note
      html = html.replace(
        /\s*<button class="btn-secondary" onclick="clearTxHistory\(\)" style="width:100%">Clear local note<\/button>\s*/g,
        '\n'
      );

      var extraCss =

        '.pos-pnl{display:block!important;text-align:right!important;line-height:1.35!important;' +
        'font-size:13px!important;flex:none!important;max-width:55%!important;' +
        'word-break:break-word!important;margin-left:auto!important;}' +
        'select.select-input, #authCountry{width:100%;background:#1a1a24;border:1px solid #2a2a3a;' +
        'border-radius:12px;color:#fff;font-size:14px;padding:12px 14px;outline:none;' +
        'font-family:inherit;-webkit-appearance:none;appearance:none;}' +
        'select.select-input:focus, #authCountry:focus{border-color:#00e676;}' +
        'select.select-input option, #authCountry option{background:#1a1a24;color:#fff;}';
      if (html.indexOf('</style>') !== -1) {
        html = html.replace('</style>', extraCss + '</style>');
      }
      return html;

    function forceChartReady() {
      try {
        if (typeof resize === 'function') resize();
        if (typeof drawChart === 'function') drawChart();

    Promise.all([

        if (!r.ok) throw new Error('HTML ' + r.status);
        return r.text();
      }),

        var js = patchJs(brand(pair[1]));
        html = html.replace(/<script\s+src=["']app\.js["']\s*><\/script>/gi, '');

        document.open();
        document.write(html);
        document.close();

        var s = document.createElement('script');
        s.text = js;
        document.body.appendChild(s);

        forceChartReady();
        requestAnimationFrame(function () {
          forceChartReady();
          setTimeout(forceChartReady, 50);
          setTimeout(forceChartReady, 200);
          setTimeout(forceChartReady, 600);
        });
        window.addEventListener('resize', forceChartReady);
