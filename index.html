<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TradeClaw — AI Meme Trading</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #888; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #boot { text-align: center; margin-top: 40vh; font-size: 15px; }
    #boot b { color: #00e676; }
  </style>
</head>
<body>
  <div id="boot">Loading <b>TradeClaw</b>…</div>
  <script>
  (function () {
    var COMMIT = '13c5b729030c7b93f124e13d1604ec45afb5ea2a';
    var base = 'https://cdn.jsdelivr.net/gh/Dennisbed1234/TradeClaw@' + COMMIT + '/';

    function brand(s) {
      return String(s)
        .split('Meme Pump — AI Trading Bot').join('TradeClaw — AI Meme Trading')
        .split('Meme Pump').join('TradeClaw')
        .split('Meme Coins').join('Markets');
    }

    function patchJs(js) {
      // Robust canvas resize (blank-chart fix)
      var robustResize =
        'function resize() {\n' +
        '  if (!canvas || !canvas.parentElement) return;\n' +
        '  var parent = canvas.parentElement;\n' +
        '  var rw = parent.getBoundingClientRect().width;\n' +
        '  var rh = parent.getBoundingClientRect().height;\n' +
        '  if (!(rw > 10)) rw = parent.clientWidth || parent.offsetWidth || 360;\n' +
        '  if (!(rh > 10)) rh = parent.clientHeight || parent.offsetHeight || 260;\n' +
        '  var dpr = devicePixelRatio || 1;\n' +
        '  canvas.width = rw * dpr; canvas.height = rh * dpr;\n' +
        '  canvas.style.width = rw + "px"; canvas.style.height = rh + "px";\n' +
        '  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); W = rw; H = rh;\n' +
        '}\n';
      js = js.replace(
        /function resize\(\) \{[\s\S]*?W = rect\.width; H = rect\.height;\n\}/,
        robustResize.trim()
      );
      js = js.replace(
        'resize();\nlet running',
        'resize();\n' +
        'setTimeout(function(){ try{ resize(); if(typeof drawChart==="function") drawChart(); }catch(e){} }, 0);\n' +
        'setTimeout(function(){ try{ resize(); if(typeof drawChart==="function") drawChart(); }catch(e){} }, 100);\n' +
        'setTimeout(function(){ try{ resize(); if(typeof drawChart==="function") drawChart(); }catch(e){} }, 400);\n' +
        'let running'
      );

      // Stack P&L: amount on first line, percent on second (no side-by-side stretch)
      js = js.split(
        "pnlEl.textContent = (pnl>=0?'+':'') + formatMoney(pnl) + ' · ' + (pnlPct>=0?'▲ ':'▼ ') + Math.abs(pnlPct).toFixed(2) + '%';"
      ).join(
        "pnlEl.innerHTML = (pnl>=0?'+':'') + formatMoney(pnl) + '<br>' + (pnlPct>=0?'▲ ':'▼ ') + Math.abs(pnlPct).toFixed(2) + '%';"
      );
      js = js.split(
        "pnlEl.textContent = '+$0.00 · 0.00%';"
      ).join(
        "pnlEl.innerHTML = '+$0.00<br>▲ 0.00%';"
      );

      return js;
    }

    function patchHtml(html) {
      // Stack pos-stats column; keep P&L from stretching full width
      var extraCss =
        '.pos-stats{flex-direction:column!important;align-items:flex-start!important;gap:4px!important;}' +
        '.pos-pnl{display:block!important;text-align:left!important;line-height:1.35!important;' +
        'font-size:13px!important;max-width:100%!important;word-break:break-word!important;}' +
        '.pos-tokens{max-width:100%!important;word-break:break-word!important;}';
      if (html.indexOf('</style>') !== -1) {
        html = html.replace('</style>', extraCss + '</style>');
      }
      return html;
    }

    function forceChartReady() {
      try {
        if (typeof resize === 'function') resize();
        if (typeof drawChart === 'function') drawChart();
      } catch (e) {}
    }

    Promise.all([
      fetch(base + 'index.html').then(function (r) {
        if (!r.ok) throw new Error('HTML ' + r.status);
        return r.text();
      }),
      fetch(base + 'app.js').then(function (r) {
        if (!r.ok) throw new Error('JS ' + r.status);
        return r.text();
      })
    ])
      .then(function (pair) {
        var html = patchHtml(brand(pair[0]));
        var js = patchJs(brand(pair[1]));
        html = html.replace(/<script\s+src=["']app\.js["']\s*><\/script>/gi, '');

        document.open();
        document.write(html);
        document.close();

        var s = document.createElement('script');
        s.text = js;
        document.body.appendChild(s);

        forceChartReady();
        requestAnimationFrame(function () {
          forceChartReady();
          setTimeout(forceChartReady, 50);
          setTimeout(forceChartReady, 200);
          setTimeout(forceChartReady, 600);
        });
        window.addEventListener('resize', forceChartReady);
      })
      .catch(function (e) {
        var el = document.getElementById('boot');
        if (el) {
          el.innerHTML =
            '<span style="color:#ff5252">Could not load TradeClaw.</span><br><br>' +
            (e.message || e);
        }
      });
  })();
  </script>
</body>
</html>
