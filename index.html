<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TradeClaw — AI Meme Trading</title>
  <style>
    body { margin: 0; background: #0a0a0f; color: #888; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #boot { text-align: center; margin-top: 40vh; font-size: 15px; }
    #boot b { color: #00e676; }
  </style>
</head>
<body>
  <div id="boot">Loading <b>TradeClaw</b>…</div>
  <script>
  (function () {
    var COMMIT = '13c5b729030c7b93f124e13d1604ec45afb5ea2a';
    var base = 'https://cdn.jsdelivr.net/gh/Dennisbed1234/TradeClaw@' + COMMIT + '/';

    function brand(s) {
      return String(s)
        .split('Meme Pump — AI Trading Bot').join('TradeClaw — AI Meme Trading')
        .split('Meme Pump').join('TradeClaw')
        .split('Meme Coins').join('Markets');
    }

    Promise.all([
      fetch(base + 'index.html').then(function (r) {
        if (!r.ok) throw new Error('HTML ' + r.status);
        return r.text();
      }),
      fetch(base + 'app.js').then(function (r) {
        if (!r.ok) throw new Error('JS ' + r.status);
        return r.text();
      })
    ])
      .then(function (pair) {
        var html = brand(pair[0]);
        var js = brand(pair[1]);

        // Remove the original <script src="app.js"> so we inject our copy
        html = html.replace(/<script\s+src=["']app\.js["']\s*><\/script>/i, '');

        document.open();
        document.write(html);
        document.close();

        // Run app logic after DOM from document.write is ready
        var s = document.createElement('script');
        s.text = js;
        document.body.appendChild(s);
      })
      .catch(function (e) {
        document.getElementById('boot').innerHTML =
          '<span style="color:#ff5252">Could not load TradeClaw.</span><br><br>' +
          (e.message || e) +
          '<br><br>Hard-refresh, or restore index.html + app.js from commit 13c5b729 on GitHub.';
      });
  })();
  </script>
</body>
</html>
